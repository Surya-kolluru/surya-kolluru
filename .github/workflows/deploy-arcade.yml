name: Deploy Surya Arcade to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "arcade/**"
      - ".github/workflows/deploy-arcade.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js for script validation
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate arcade JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("arcade/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\\b[^>]*>(.*?)</script>", html, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one game module, found {len(scripts)}")
          Path("/tmp/arcade.mjs").write_text(scripts[0], encoding="utf-8")
          print("Extracted arcade module for syntax validation.")
          PY
          node --check /tmp/arcade.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare GitHub Pages site structure
        run: |
          mkdir -p _site/arcade
          cp arcade/index.html _site/arcade/index.html
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0;url=./arcade/">
            <title>Surya Arcade</title>
            <style>
              body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050a08;color:#e8fff0;font:16px system-ui}
              main{padding:32px;text-align:center;border:1px solid #24633b;border-radius:18px;background:#0b1710}
              a{display:inline-block;margin-top:16px;padding:12px 20px;border-radius:9px;background:#39ff88;color:#06200f;text-decoration:none;font-weight:800}
            </style>
          </head>
          <body><main><h1>Surya Arcade</h1><p>Opening the games…</p><a href="./arcade/">ENTER ARCADE</a></main></body>
          </html>
          HTML

      - name: Upload arcade site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy arcade
        id: deployment
        uses: actions/deploy-pages@v4
