name: Test and deploy Lantern Room Arcade

on:
  push:
    branches: [main]
    paths:
      - "arcade/**"
      - "assets/arcade-preview.svg"
      - ".github/workflows/deploy-arcade.yml"
      - "README.md"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: [main]
    paths:
      - "arcade/**"
      - "assets/arcade-preview.svg"
      - ".github/workflows/deploy-arcade.yml"
      - "README.md"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install pinned test dependencies
        run: npm ci

      - name: Validate JavaScript modules and local references
        run: |
          set -e
          while IFS= read -r file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find arcade/js -type f -name '*.js' | sort)
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('arcade')
          html=(root/'index.html').read_text(encoding='utf-8')
          refs=re.findall(r'(?:href|src)="(\./[^"]+)"',html)
          missing=[x for x in refs if not (root/x[2:].split('#',1)[0]).is_file()]
          if missing: raise SystemExit('Missing local references: '+', '.join(missing))
          ids=set(re.findall(r'data-open-game="([^"]+)"',html))
          expected={'snake','fire','chess','lantern-maze','block-circuit','starline-siege','void-drifter','prism-breaker'}
          if ids != expected: raise SystemExit(f'Expected eight game routes, found {sorted(ids)}')
          for game in expected:
              if not list((root/'assets').glob(f'{game}/card-art.svg')) and game not in {'snake','fire','chess'}:
                  raise SystemExit(f'Missing original card art for {game}')
          for svg in root.rglob('*.svg'):
              import xml.etree.ElementTree as ET
              ET.parse(svg)
          if not (root/'assets/stockfish.wasm').is_file(): raise SystemExit('Missing local chess engine WASM')
          print(f'Validated {len(refs)} page references, eight routes, SVG assets and chess engine artifact.')
          PY

      - name: Run deterministic game logic tests
        run: npm run test:logic

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Start local static arcade server
        run: |
          python3 -m http.server 4173 --bind 0.0.0.0 --directory arcade > /tmp/lantern-room-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              echo "Static arcade server is ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lantern-room-server.log
          exit 1

      - name: Run Playwright gameplay, responsive and accessibility checks
        env:
          ARCADE_URL: http://127.0.0.1:4173/
        run: npm run test:browser

      - name: Upload QA screenshots and accessibility findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lantern-room-arcade-qa
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 30

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare the repository-subpath Pages site
        run: |
          mkdir -p _site/arcade
          cp arcade/index.html arcade/THIRD_PARTY_NOTICES.md _site/arcade/
          cp -R arcade/css arcade/js arcade/assets _site/arcade/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=./arcade/"><title>Lantern Room Arcade</title></head>
          <body><main><h1>Lantern Room Arcade</h1><p>Opening the games…</p><a href="./arcade/">Enter the arcade</a></main></body></html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
