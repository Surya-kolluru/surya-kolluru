name: Test and deploy The Side Room

on:
  push:
    branches:
      - main
    paths:
      - "arcade/**"
      - "assets/arcade-preview.svg"
      - ".github/workflows/deploy-arcade.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check every game module
        run: |
          set -e
          for file in arcade/js/*.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Check required local assets and styles
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path("arcade")
          html = (root / "index.html").read_text(encoding="utf-8")
          required = re.findall(r'(?:href|src)="(\./[^"]+)"', html)
          required = [p for p in required if p not in {"./", "./#"}]
          missing = [p for p in required if not (root / p[2:].split("#", 1)[0]).is_file()]
          if missing:
              raise SystemExit("Missing local files: " + ", ".join(missing))
          for js in (root / "js").glob("*.js"):
              if js.stat().st_size < 100:
                  raise SystemExit(f"Unexpectedly small JS module: {js}")
          print(f"Validated {len(required)} local HTML references and {len(list((root / 'js').glob('*.js')))} JavaScript modules.")
          PY

      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local arcade server
        run: |
          python3 -m http.server 4173 --directory arcade > /tmp/side-room-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              echo "Arcade server is ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/side-room-server.log
          exit 1

      - name: Run responsive screenshots and gameplay regression tests
        env:
          ARCADE_URL: http://127.0.0.1:4173/
        run: node arcade/tests/smoke.mjs

      - name: Upload visual test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: side-room-viewport-screenshots
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 30

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare GitHub Pages site structure
        run: |
          mkdir -p _site/arcade
          cp arcade/index.html arcade/THIRD_PARTY_NOTICES.md _site/arcade/
          cp -R arcade/css arcade/js arcade/assets _site/arcade/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0;url=./arcade/">
            <title>The Side Room</title>
            <style>
              body{margin:0;min-height:100vh;display:grid;place-items:center;background:#18231f;color:#eee7d8;font:16px Georgia,serif}
              main{padding:34px;text-align:center;border:1px solid #536255;background:#202d27}
              a{display:inline-block;margin-top:16px;padding:12px 20px;background:#d0d9bd;color:#202c23;text-decoration:none;font:700 11px monospace;letter-spacing:.1em}
            </style>
          </head>
          <body><main><h1>The Side Room</h1><p>Opening the games…</p><a href="./arcade/">ENTER THE SIDE ROOM</a></main></body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy arcade
        id: deployment
        uses: actions/deploy-pages@v4
