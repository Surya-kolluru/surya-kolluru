name: Deploy Surya Arcade to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "arcade/**"
      - ".github/workflows/deploy-arcade.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js for script validation
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate arcade JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("arcade/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one inline game script, found {len(scripts)}")
          Path("/tmp/arcade.js").write_text(scripts[0], encoding="utf-8")
          print("Extracted arcade JavaScript for syntax validation.")
          PY
          node --check /tmp/arcade.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload arcade site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./arcade

      - name: Deploy arcade
        id: deployment
        uses: actions/deploy-pages@v4
