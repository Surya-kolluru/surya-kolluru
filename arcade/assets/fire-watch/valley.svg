 <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#536b4c"/><stop offset="1" stop-color="#253d31"/></linearGradient>
 <linearGradient id="tower" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b98a5c"/><stop offset="1" stop-color="#694d3b"/></linearGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
