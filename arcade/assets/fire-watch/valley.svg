<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">North Ridge valley at dusk</title>
<desc id="desc">A layered forest valley with distant blue mountains, fir woods, timber cabins and a small fire lookout tower.</desc>
