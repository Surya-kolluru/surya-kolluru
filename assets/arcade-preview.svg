<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="t d">
<title id="t">Surya Arcade — two playable mini games</title>
<desc id="d">Two neon green arcade game panels for Snake and Fire Defense.</desc>
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#0b1710"/><stop offset="1" stop-color="#030805"/></linearGradient>
