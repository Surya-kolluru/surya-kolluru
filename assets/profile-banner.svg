    <circle cx="74" cy="44" r="5" fill="#39ff88"/><circle cx="0" cy="72" r="5" fill="#39ff88"/><circle cx="128" cy="154" r="5" fill="#39ff88"/><circle cx="176" cy="56" r="5" fill="#39ff88"/><circle cx="210" cy="122" r="5" fill="#39ff88"/><circle cx="106" cy="202" r="5" fill="#39ff88"/>
