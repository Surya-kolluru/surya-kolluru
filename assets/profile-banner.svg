  <text x="64" y="169" fill="url(#glow)" filter="url(#softGlow)" font-family="monospace" font-size="48" font-weight="700">SURYESH</text>
  <text x="66" y="207" fill="#c5f9d4" font-family="monospace" font-size="20">AI ENGINEERING  //  MACHINE LEARNING  //  COMPUTER VISION</text>
  <text x="66" y="243" fill="#65d98e" font-family="monospace" font-size="15">[ PYTHON ]  [ PYTORCH ]  [ REACT ]  [ IoT ]</text>
  <text x="66" y="285" fill="#48976a" font-family="monospace" font-size="13">&gt; building intelligent systems for real-world problems_</text>
