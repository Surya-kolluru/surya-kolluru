<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Surya — AI Engineering</title>
  <desc id="desc">Terminal-style profile banner with neon green typography, a subtle grid and a circuit motif.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020805"/><stop offset="1" stop-color="#07150d"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9cffb7"/><stop offset="1" stop-color="#25e879"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#1d623b" stroke-width=".65" opacity=".25"/></pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="330" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="328" rx="21" fill="url(#grid)" stroke="#287c4a" stroke-width="1.4"/>
  <rect x="16" y="16" width="1168" height="298" rx="15" fill="none" stroke="#1a4c30" stroke-width="1"/>
